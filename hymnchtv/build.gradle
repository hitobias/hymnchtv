apply plugin: 'com.android.application'
apply plugin: 'com.mikepenz.aboutlibraries.plugin.android'
apply plugin: 'com.google.devtools.ksp'

android {
    compileSdk = rootProject.compileSdk
    buildToolsVersion = rootProject.buildTools

    defaultConfig {
        namespace = 'org.cog.hymnchtv'
        // New identity (sub-project Z): the code package stays org.cog.hymnchtv; only the installed app id changes.
        applicationId = 'com.ziontkec.hymnal'

        // versionCode = X*100000 + Y*1000 + Z*10 + n; the end digit n forces an update with the same version number
        versionCode 100000
        versionName "1.0.0"

        minSdkVersion rootProject.minSdk
        targetSdkVersion rootProject.compileSdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Gradle-driven installs (connected tests) grant runtime permissions up front so that the app process starts with
    // the storage group; a later `pm grant` from inside a test does not reach an already running process.
    installation {
        installOptions = ['-g']
    }

    androidResources {
        generateLocaleConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'boolean', 'ALLOW_MAIN_THREAD_DB', 'true'
        }

        debug {
            debuggable = true
            minifyEnabled = false
            // 1.0 gate (DatabaseBackend class doc): -PstrictDbThread builds the app database without
            // allowMainThreadQueries(), so any remaining main-thread query throws IllegalStateException.
            buildConfigField 'boolean', 'ALLOW_MAIN_THREAD_DB', project.hasProperty('strictDbThread') ? 'false' : 'true'
        }

        // Startup measurements only (plan B.3-1): release configuration, not debuggable, debug-signed so it installs anywhere.
        benchmark {
            initWith release
            signingConfig = signingConfigs.debug
            debuggable = false
            matchingFallbacks = ['release']
        }
    }
    // The benchmark build type has no sources of its own: reuse release's (TimberLogImpl lives in src/debug and src/release only).
    sourceSets {
        benchmark {
            java.srcDir 'src/release/java'
        }
    }
    buildFeatures {
        buildConfig = true
    }

    File cfgFile = project.rootProject.file("settings.signing")
    if (cfgFile != null && cfgFile.exists()) {
        println "### Found settings.signing to prepare signingConfig for release signing"
        signingConfigs {
            release {
                Properties config = new Properties()
                config.load(new FileInputStream(cfgFile))

                storeFile file(config.getProperty('keystore'))
                File propsFile = file(config.getProperty('secure_properties'))
                if (propsFile.exists()) {
                    Properties props = new Properties()
                    props.load(new FileInputStream(propsFile))
                    storePassword props.getProperty('key.store.password')
                    keyAlias props.getProperty('key.store.alias')
                    keyPassword props.getProperty('key.alias.password')
                }
            }
        }
        buildTypes.release.signingConfig = signingConfigs.release
    }

    testOptions {
        unitTests.all {
            it.systemProperty 'hymnchtv.assetsDir', file('src/main/assets').absolutePath
            it.systemProperty 'hymnchtv.resDir', file('src/main/res').absolutePath
            it.systemProperty 'hymnchtv.repoRoot', rootProject.projectDir.absolutePath
        }
    }

    lint {
        abortOnError = false
        lintConfig = file('lint.xml')
        // disable 'MissingTranslation', 'InvalidPackage', 'MissingQuantity', 'AppCompatResource'
        disable 'NonConstantResourceId'
    }

    packagingOptions {
        resources {
            excludes += [
                    'META-INF/io.netty.versions.properties',
                    'META-INF/DEPENDENCIES',
                    'META-INF/INDEX.LIST',
                    'META-INF/package-info'
            ]
        }
    }
}

// Room schema JSON is committed so future versions can write and test migrations.
ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
    arg('room.generateKotlin', 'true')
}

dependencies {
    implementation project(':android-youtube-player:core')

    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.fragment:fragment-ktx:1.9.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'

    implementation('com.jakewharton.timber:timber:5.0.1') {
        transitive = false
    }

    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.9'
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    implementation 'androidx.exifinterface:exifinterface:1.3.6'

    implementation 'de.cketti.library.changelog:ckchangelog:1.2.2'
    // 1.16.1: Failed to transform commons-codec-1.16.1.jar
    implementation 'commons-codec:commons-codec:1.22.1'
    implementation 'commons-io:commons-io:2.22.0'

    // implementation 'com.google.android.play:core:1.10.3'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'

    implementation 'jp.wasabeef:richeditor-android:2.0.0'
    // For toc pinyin generation.
    implementation 'net.duguying.pinyin:pinyin:0.0.1'
    implementation 'org.apache.commons:commons-text:1.15.0'
    implementation 'org.apache.httpcomponents:httpcore:4.4.16'

    implementation 'org.jetbrains:annotations:26.1.0'
    implementation 'org.jsoup:jsoup:1.23.2'

    // Unified Room database (plan: Room unification)
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.truth:truth:1.4.5'
    // Real org.json for JVM unit tests (android.jar only ships stubs); the app uses the platform copy.
    testImplementation 'org.json:json:20250517'

    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'com.google.truth:truth:1.4.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

// Uncomment below lines if you want to show all deprecated warnings
tasks.withType(JavaCompile).configureEach {
    // options.compilerArgs << '-Xlint:unchecked'
    options.deprecation = true
}

// LyricsHantAssetsTest reads these files directly; declare them so Gradle re-runs unit tests when they change.
tasks.withType(Test).configureEach {
    inputs.files(fileTree('src/main/assets') { include 'lyrics_*_text*/**', 'lyrics_hant_manifest.txt', 'lyrics_t2s_map.txt' })
        .withPathSensitivity(PathSensitivity.RELATIVE)
        .withPropertyName('lyricsAssets')
    inputs.files(['gen_lyrics_hant.py', 'lyrics_hant_overrides.tsv', 'rcv_prefs.py', 'rcv_word_prefs.tsv', 'rcv_char_prefs.tsv',
                  'rcv_pair_decisions.tsv', 'rcv_review_decisions.tsv'].collect { rootProject.file("tools/$it") })
        .withPathSensitivity(PathSensitivity.RELATIVE)
        .withPropertyName('lyricsGeneratorInputs')
}

// Reading-settings sync tests (plan A2) read generated resources and generator inputs directly.
tasks.withType(Test).configureEach {
    inputs.files(fileTree('src/main/res') {
        include 'drawable*/bg_*', 'drawable*/bgx_*', 'font/**', 'xml/reading_preferences.xml', 'values/reading_arrays.xml',
                'values*/strings*.xml'
    }).withPathSensitivity(PathSensitivity.RELATIVE).withPropertyName('readingResources')
    inputs.files(fileTree('src/main/assets') { include 'licenses/**' })
        .withPathSensitivity(PathSensitivity.RELATIVE).withPropertyName('readingAssets')
    inputs.files(rootProject.file('tools/font_subset_manifest.txt'))
        .withPathSensitivity(PathSensitivity.RELATIVE).withPropertyName('readingGeneratorInputs')
}

// IdentityGuardTest scans shipped sources, assets, Gradle files and the README (sub-project Z).
tasks.withType(Test).configureEach {
    inputs.files(fileTree('src/main/java'), fileTree('src/main/res'), fileTree('src/main/assets'),
            file('src/main/AndroidManifest.xml'), fileTree('aboutlibraries-config'), file('build.gradle'),
            rootProject.file('build.gradle'), rootProject.file('README.md'))
        .withPathSensitivity(PathSensitivity.RELATIVE)
        .withPropertyName('identityGuardSources')
}

// Open-source license notices for the About page (sub-project Z), generated at build time into R.raw.aboutlibraries.
// Property-style access avoids Groovy's built-in collect() on the configuration closures.
aboutLibraries.collect.configPath.set(file('aboutlibraries-config'))
aboutLibraries.collect.fetchRemoteLicense.set(false)
aboutLibraries.export.excludeFields.addAll('developers', 'funding', 'organization', 'scm', 'website')

// Hard license gate (sub-project Z): the plugin's strict mode plus verifyLicenseNotices, both driven by
// aboutlibraries-config/license-allowlist.txt. assembleRelease fails on any library with no license, an
// unapproved license, or a license without full text. Only the user adds allowlist entries (Task 12 Step 11).
def licenseAllowlist = file('aboutlibraries-config/license-allowlist.txt')
def licenseRules = licenseAllowlist.readLines()*.trim().findAll { it && !it.startsWith('#') }
def allowedEverywhere = licenseRules.findAll { it.startsWith('license ') }.collect { it.substring('license '.length()).trim() }
aboutLibraries.license.strictMode.set(com.mikepenz.aboutlibraries.plugin.StrictMode.FAIL)
aboutLibraries.license.allowedLicenses.addAll(allowedEverywhere)
licenseRules.findAll { it.startsWith('library ') }.each { rule ->
    def (ignored, libraryId, licenseKey) = rule.split(/\s+/, 3) as List
    aboutLibraries.license.allowedLicensesMap.put(licenseKey, (aboutLibraries.license.allowedLicensesMap.getting(licenseKey).getOrElse([]) + [libraryId]))
}

tasks.register('verifyLicenseNotices') {
    group = 'verification'
    description = 'Fails unless every bundled library has an approved license with full text (sub-project Z).'
    dependsOn 'prepareLibraryDefinitionsRelease'
    def generated = layout.buildDirectory.file('generated/aboutLibraries/release/res/raw/aboutlibraries.json')
    inputs.file(licenseAllowlist)
    inputs.file(generated)
    doLast {
        def data = new groovy.json.JsonSlurper().parse(generated.get().asFile)
        def problems = []
        data.libraries.each { lib ->
            def keys = lib.licenses ?: []
            if (keys.isEmpty()) {
                problems << "${lib.uniqueId}: no license"
            }
            keys.each { key ->
                boolean approved = allowedEverywhere.contains(key) || licenseRules.contains("library ${lib.uniqueId} ${key}".toString())
                if (!approved) {
                    problems << "${lib.uniqueId}: license '${key}' is not in aboutlibraries-config/license-allowlist.txt"
                }
                if (!data.licenses[key]?.content) {
                    problems << "${lib.uniqueId}: no full text for license '${key}' (add aboutlibraries-config/licenses/<file>.json)"
                }
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("License gate failed:\n  " + problems.unique().join("\n  "))
        }
    }
}
tasks.matching { it.name == 'assembleRelease' }.configureEach { dependsOn 'verifyLicenseNotices' }
