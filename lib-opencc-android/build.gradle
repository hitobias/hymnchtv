apply plugin: 'com.android.library'
android {
    compileSdk = rootProject.compileSdk
    buildToolsVersion = rootProject.buildTools

    ndkVersion = '28.2.13676358'
    defaultConfig {
        namespace = 'com.zqc.opencc.android.lib'
        minSdkVersion rootProject.minSdk
        targetSdkVersion rootProject.compileSdk

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                // Only libChineseConverter.so is wanted in the AAR; OpenCC's
                // command line tools and dictionary generation targets are
                // excluded from the build (see src/main/jni/CMakeLists.txt).
                targets 'ChineseConverter'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/jni/CMakeLists.txt'
            // OpenCC's CMakeLists.txt requires CMake >= 3.12, so the 3.10.2
            // that AGP would otherwise pick is not enough.
            version = '4.1.2'
        }
    }

    dependencies {
        androidTestImplementation('junit:junit:4.13.2')
        androidTestImplementation 'androidx.test.ext:junit:1.3.0'
        androidTestImplementation('androidx.test:core:1.7.0')
        androidTestImplementation('androidx.test:runner:1.7.0')
        androidTestImplementation('androidx.test:rules:1.7.0')
    }
}

/*
 * This task downloads lib source for OpenCC per the specified version in the scripts.
 * This task must be executed at least once prior to hymnchtv apk build process.
 */
tasks.register('initJniLibs', Exec) {
    group = 'Custom Tasks'
    workingDir "src/main/jni/"
    executable './init_libopencc.sh'
}